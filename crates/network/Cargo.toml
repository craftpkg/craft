[package]
name = "network"
version = "0.1.0"
edition = "2024"

[lints]
workspace = true

[dependencies]
reqwest = { version = "0.12", default-features = false, features = ["json", "gzip", "brotli", "charset", "http2", "system-proxy", "rustls-tls-webpki-roots"] }
contract = { path = "../contract" }
tokio = { version = "1.0", features = ["rt", "time", "sync", "fs", "io-util"] }
serde_json = "1.0"
anyhow = "1.0"
bytes = "1"
debug = { path = "../debug" }
serde = { version = "1.0", features = ["derive"] }
tempfile = "3.10"
base64 = "0.22"
sha1 = "0.10"
sha2 = "0.10"
