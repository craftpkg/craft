[package]
name = "fsutil"
version = "0.1.0"
edition = "2024"

[lints]
workspace = true

[dependencies]
tokio = { version = "1.48.0", features = ["fs", "rt", "time"] }
reflink-copy = "0.1"

[target.'cfg(windows)'.dependencies]
junction = "1"

[dev-dependencies]
tempfile = "3.10"
tokio = { version = "1.48.0", features = ["fs", "macros", "rt-multi-thread"] }
