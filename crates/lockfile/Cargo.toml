[package]
name = "lockfile"
version = "0.1.0"
edition = "2024"

[lints]
workspace = true

[dependencies]
anyhow = "1.0"
contract = { path = "../contract" }
fsutil = { path = "../fsutil" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1", features = ["fs"] }

[dev-dependencies]
tempfile = "3.10"
tokio = { version = "1", features = ["fs", "macros", "rt"] }
