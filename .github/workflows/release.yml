name: Release

on:
  push:
    tags:
      - '*'

permissions:
  contents: write

jobs:
  build-and-upload:
    name: Build and Upload
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            artifact_name: craft
            asset_name: craft-linux-amd64
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            artifact_name: craft
            asset_name: craft-linux-arm64
          - os: ubuntu-latest
            target: x86_64-unknown-linux-musl
            artifact_name: craft
            asset_name: craft-linux-amd64-musl
            musl: true
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-musl
            artifact_name: craft
            asset_name: craft-linux-arm64-musl
            musl: true
          - os: macos-latest
            target: x86_64-apple-darwin
            artifact_name: craft
            asset_name: craft-darwin-amd64
          - os: macos-latest
            target: aarch64-apple-darwin
            artifact_name: craft
            asset_name: craft-darwin-arm64
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            artifact_name: craft.exe
            asset_name: craft-windows-amd64.exe

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install musl tools
        if: matrix.musl
        run: sudo apt-get update && sudo apt-get install -y musl-tools

      - name: Build release binary
        run: cargo build --release --target ${{ matrix.target }} -p craft
        env:
          CRAFT_RELEASE_VERSION: ${{ github.ref_name }}

      - name: Rename binary and write its checksum
        shell: bash
        run: |
          cp target/${{ matrix.target }}/release/${{ matrix.artifact_name }} ${{ matrix.asset_name }}
          if command -v sha256sum >/dev/null; then
            sha256sum ${{ matrix.asset_name }} > ${{ matrix.asset_name }}.sha256
          else
            shasum -a 256 ${{ matrix.asset_name }} > ${{ matrix.asset_name }}.sha256
          fi

      - name: Upload binary to release
        uses: softprops/action-gh-release@v1
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: |
            ${{ matrix.asset_name }}
            ${{ matrix.asset_name }}.sha256
